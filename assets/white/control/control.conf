# control.conf - settings for the range control server (greyctl). install.sh copies this file to
# /etc/greyctl/control.conf; greyctl and the API read that copy. Edit here, then: sudo bash install.sh --go
#
# License: GPL-3.0, Dire Wolf Security.

# This server's address on WHITECELL. Off-limits to both teams: the core's WHITE-PROTECT list
# already stops anything outside WHITECELL from reaching it.
CONTROL_IP="172.16.12.40"

# How to reach each grey server. ssh:root@ADDRESS = over SSH with greyctl's own key, which can run
# only that server's one apply command (install.sh --keys prints the line to add there).
# Leave a setting empty while that server is not built yet; greyctl then skips it.
REGISTRAR="ssh:root@172.16.11.11"
GEOIP=""                 # ssh:root@172.16.11.50 once geoip.lab is built
WHOIS=""                 # ssh:root@172.16.11.43 once whois.lab is built (#7, assets/grey/whois)
DNS=""                   # ssh:root@172.16.11.13 once the reverse DNS server is built (#3, assets/grey/reverse-dns)

# The API. Only these sources may reach it (ufw, on this server), space separated.
# WHITECELL by default. ForgeRange will have a WHITECELL address in production; add others here.
API_PORT="8443"
API_ALLOW="172.16.12.0/24"
FIREWALL="yes"

# HTTPS for the API. Put a certificate from the range CA here (README step 4). Without them the
# API runs on plain HTTP and says so.
TLS_CERT="/etc/greyctl/tls/server.crt"
TLS_KEY="/etc/greyctl/tls/server.key"

# AS numbers handed to exercise teams. registry.py allows 65000-65499 for teams.
TEAM_ASN_FIRST="65000"
TEAM_ASN_LAST="65499"

# Where greyctl keeps its state, snapshots, tokens and SSH key. Back this folder up.
STATE_DIR="/var/lib/greyctl"
TOKENS_FILE="/var/lib/greyctl/tokens"
SSH_KEY="/var/lib/greyctl/.ssh/id_ed25519"
REGISTRY_DIR="/opt/greyctl/registry"
