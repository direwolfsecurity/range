# range-syslog.conf - settings for the range syslog server (install.sh reads this file).
#
# License: GPL-3.0, Dire Wolf Security.

# The DNS name devices use to find this server.
SERVER_NAME="syslog.lab"

# Port for both UDP and TCP. 514 is the standard. Arduino and ESP32 tiles usually send UDP.
PORT="514"

# Also listen on TCP. "yes" or "no".
TCP="yes"

# Where the logs go: all.log (everything) and one file per sending address.
LOG_DIR="/var/log/range"

# How many days of logs to keep. Older ones are deleted by logrotate.
KEEP_DAYS="14"
