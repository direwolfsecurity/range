# Dire Wolf Security - grey cell map tile server settings
# Read by install.sh (bash syntax). Change values here, never in install.sh.
# License: GPL-3.0

# --- Network (GREY, VLAN 110) -------------------------------------------
MAPS_HOSTNAME="maps"
MAPS_IP="172.16.11.60"
MAPS_PREFIX="24"
MAPS_GATEWAY="172.16.11.254"
MAPS_DNS="172.16.11.10"          # grey public resolver (not built yet; harmless until it is)
MAPS_NTP="172.16.11.123"         # range NTP Pi (proposed address)
MAPS_NIC=""                      # blank = first ethernet NIC found (usually ens18 on Proxmox)

# --- Disks inside the VM ------------------------------------------------
# install.sh formats a disk only when it is completely blank. A missing disk
# is fine for the small test: the folders are then made on the main disk.
MAPS_DISK="/dev/sdb"             # ~300 GB, kept. Mounted at /srv/maps
BUILD_DISK="/dev/sdc"            # ~1.2 TB, scratch. Mounted at /build. Delete after the build.
MAPS_DIR="/srv/maps"
BUILD_DIR="/build"

# --- Software versions (pinned so every build is the same) --------------
# No Docker. Planetiler runs as a plain Java program, TileServer GL is
# installed from npm, and both run as systemd services.
PLANETILER_VERSION="0.10.2"      # github.com/onthegomap/planetiler releases
PLANETILER_SHA256="f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d"
TILESERVER_VERSION="5.6.0"       # npm package tileserver-gl
NODE_VERSION="22.23.5"           # Node.js LTS from nodejs.org (TileServer GL 5.6 needs 20, 22 or 24)
NODE_SHA256="cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8"
APP_DIR="/opt/direwolf-maps"     # where Node, TileServer GL and Planetiler are installed
RUN_USER="dwmaps"                # system user the two services run as

# --- Planet build -------------------------------------------------------
# AREA: "planet" for the whole world. A Geofabrik region name ("monaco", or a
# state or country near you) does a small test build in minutes.
AREA="planet"
# MAXZOOM: 14 is the OpenMapTiles standard. Zoom-14 tiles already hold every
# feature; the server draws zoom 15-20 from them. 16 keeps more shape detail
# (buildings, coastlines) but costs much more disk and build time. Untested here.
MAXZOOM="14"
# Wikidata adds place names in other languages. Slow, and it can time out.
FETCH_WIKIDATA="no"
# Java heap. "auto" picks from the VM's RAM (see README, "How much RAM").
JAVA_HEAP="auto"
# Planetiler output name (inside MAPS_DIR/data)
TILES_FILE="planet.mbtiles"

# --- Test point ---------------------------------------------------------
# install.sh --check fetches the zoom-14 tile over this point, so it must be
# inside AREA. The default matches the AREA="monaco" test build. Set it to
# your own town if you like; any point works once the planet is built.
TEST_PLACE="Monaco"
TEST_LAT="43.7384"
TEST_LON="7.4246"

# --- Styles, sprites and fonts (pinned commits) -------------------------
# Format: name|repo|style commit|gh-pages (sprite) commit
STYLES=(
  "osm-bright|https://github.com/openmaptiles/osm-bright-gl-style.git|563b249f7ae71528b1f1e327cb9c019d0dda4c50|286b174adbd6e8693887841d6cfdf7445cd5f8c0"
  "positron|https://github.com/openmaptiles/positron-gl-style.git|bed9a6349dfb431bd8a6646101d0977b59c591dd|98f91afa38671a885947d721075bdc88392c1b78"
  "dark-matter|https://github.com/openmaptiles/dark-matter-gl-style.git|d17442cb66bad8c82bda59d199d5dafeead410cf|9769cd7a3642e607bb867c4c0c18bed714f52f5a"
  "basic|https://github.com/openmaptiles/maptiler-basic-gl-style.git|65b58c5d715b470f8f381a6c519a554653e89d98|1145d613080a13d7c74721d67b7a70e1631741ab"
)
# Pre-built font glyphs (gh-pages branch of openmaptiles/fonts)
FONTS_REPO="https://github.com/openmaptiles/fonts.git"
FONTS_COMMIT="025ff2b2f84cc0fdf11f7b1d74b3a784595fe7a4"
# The default style. Its PNG tiles are also served at /{z}/{x}/{y}.png
DEFAULT_STYLE="osm-bright"

# --- Web ----------------------------------------------------------------
TILESERVER_PORT="8080"           # tileserver-gl, bound to localhost only
NGINX_CACHE_GB="40"              # rendered-tile cache on MAPS_DISK
ATTRIBUTION='&copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
