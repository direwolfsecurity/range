# whois.conf - settings for the range whois server (whois.lab). install.sh and whoisd.py read this file.
#
# License: GPL-3.0, Dire Wolf Security.

# The DNS name of this server. Register it on the root primary (install.sh --registrar).
SERVER_NAME="whois.lab"

# The name of the fake internet registry, shown at the top of every answer.
# (Open decision: Tim picks the real name. Change it here, in registry.csv's GREY row and in geoip.conf.)
REGISTRY_NAME="Grey Internet Registry"

# The registry file, read together with registry.py next to it.
# Default: the copy you get with the two-folder clone in the README. install.sh copies both to
# /opt/direwolf-whois/registry/ for the service. After a git pull, run install.sh --go again.
REGISTRY_FILE="../../../network/registry/registry.csv"

# Exercise teams: the range control server (assets/white/control) writes this file and runs
# whois-apply. Same columns as registry.csv. Missing or empty = no exercise, registry.csv only.
# The server notices a new file by itself: no restart.
OVERLAY_FILE="/etc/direwolf-range/overlay.csv"

# Domains are not in the address registry; the registrar on root-a has them. Domain questions
# are passed to its whois page (REGISTRAR_URL/whois.php), the way a "thin" registry sends you on.
REGISTRAR_URL="http://nic.lab"

# The date every network in registry.csv was "registered" (RegDate). Exercise teams get the day
# their overlay was written.
REG_DATE="2026-11-13"

# Ports. 43 is whois. 80 is the web page and RDAP (http://whois.lab/rdap/).
LISTEN="0.0.0.0"
WHOIS_PORT="43"
HTTP_PORT="80"
