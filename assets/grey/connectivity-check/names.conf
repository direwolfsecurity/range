# names.conf - the "well-known names": real internet names that the range answers itself.
#
# One name per line:  <name>  <answer>
#   check     = this server (the connectivity check web pages)
#   ntp       = NTP_IP in check.conf (the range time server)
#   an IP     = that address, exactly
# A name can start with "*." to cover everything under it (for example *.pool.ntp.org).
#
# The zone for each name is its last two parts (msftconnecttest.com, gstatic.com ...).
# This server answers for the WHOLE zone, so a name not listed here gets "no such name".
# After a change: sudo bash install.sh --go, then on the root primary run the commands
# that "sudo bash install.sh --registrar" prints (only needed when a new zone appears).
#
# Later builds (package mirrors, mail ...) add their real-world names here too.
#
# License: GPL-3.0, Dire Wolf Security.

# ---- Windows (NCSI: the "No Internet" globe) ----
www.msftconnecttest.com          check
msftconnecttest.com              check
www.msftncsi.com                 check
# Windows also checks that this name gives exactly this address. Nothing needs to answer there.
dns.msftncsi.com                 131.107.255.255

# ---- Android and Chrome ----
connectivitycheck.gstatic.com    check
connectivitycheck.android.com    check
www.google.com                   check
google.com                       check
clients1.google.com              check
clients3.google.com              check
play.googleapis.com              check

# ---- Apple (iPhone, iPad, Mac) ----
captive.apple.com                check
www.apple.com                    check

# ---- Firefox ----
detectportal.firefox.com         check

# ---- Linux (NetworkManager) ----
connectivity-check.ubuntu.com    check
nmcheck.gnome.org                check
network-test.debian.org          check
fedoraproject.org                check

# ---- Time (point clocks at the range NTP server) ----
time.windows.com                 ntp
time.apple.com                   ntp
time.google.com                  ntp
ntp.ubuntu.com                   ntp
pool.ntp.org                     ntp
*.pool.ntp.org                   ntp
