# check.conf - settings for the range connectivity check server (install.sh reads this file).
#
# License: GPL-3.0, Dire Wolf Security.

# The DNS name of this server. It is also the name server for every zone in names.conf.
SERVER_NAME="check.lab"

# Where the time names in names.conf point (time.windows.com, pool.ntp.org ...): the range NTP server.
NTP_IP="172.16.11.123"

# The range resolver. --check asks it too, to see that the names reach this server through the roots.
RESOLVER="172.16.11.10"

# HTTPS for the check names too, with a certificate from the range CA (../ca/). "yes" or "no".
# Only Android uses an HTTPS check, and only phones that trust the range root will pass it.
# Needs the CA built and the names registered first (README steps 3 and 5).
HTTPS="no"

# The range CA. Used only when HTTPS="yes".
CA_URL="http://ca.lab"
ACME_URL="https://ca.lab/acme/acme/directory"
# The root fingerprint the CA's --check shows. Empty = trust whatever ca.lab sends (not wise).
CA_FINGERPRINT=""
