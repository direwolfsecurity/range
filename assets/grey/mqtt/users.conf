# users.conf - who may log in to the broker in SECURE mode, and what each may do.
# No passwords here. install.sh makes a password for each new name and shows it ONCE.
#
# One user per line:   name   kind   [extra rights...]
#
# Kinds:
#   teacher   read and write every topic, plus the broker's own $SYS status topics
#   monitor   read every topic, write nothing (for scoring, dashboards, the blue team)
#   tile      name must be <tile>-<number>, for example intersection-1.
#             It may read and write cybercity/<tile>/<number>/# (its own state, cmd, online, event)
#             and read the city-wide alert topic cybercity/city/alert.
#
# Extra rights (optional, any number of pairs):   read <topic>   write <topic>   readwrite <topic>
# + matches one level, # matches everything below.
#
# After changing this file, run:  sudo bash install.sh --go
# A name you delete here loses its login.
#
# License: GPL-3.0, Dire Wolf Security.

teacher          teacher
monitor          monitor
intersection-1   tile
firestation-1    tile      write cybercity/intersection/+/cmd
