# mqtt.conf - settings for the range MQTT broker (install.sh reads this file).
# You can also give most of these as options, for example: sudo bash install.sh --mode secure --go
# The mode you set last with --mode is remembered on the server.
#
# License: GPL-3.0, Dire Wolf Security.

# open   = anyone can connect, read and write every topic. For attack labs.
# secure = a login for every tile and person, and each login may only use its own topics (users.conf).
MODE="open"

# The DNS name tiles use to find the broker. It goes in the TLS certificate.
SERVER_NAME="mqtt.lab"

# Plain MQTT. Passwords and messages cross the network as readable text (good for sniffing labs).
PORT="1883"

# Encrypted MQTT (TLS) on a second port. "yes" or "no". Plain PORT stays on for boards that can't do TLS.
TLS="no"
TLS_PORT="8883"

# Secure mode only: "yes" lets anyone without a login READ cybercity/# (but never write).
# A halfway step for labs: the city can still be watched, but not controlled.
ANONYMOUS_READ="no"

# Send the broker's log to a range syslog server as well. Empty = keep logs on this server only.
# Example once the syslog server is built: SYSLOG_HOST="syslog.lab"
SYSLOG_HOST=""
SYSLOG_PORT="514"
