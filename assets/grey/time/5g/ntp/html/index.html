<!DOCTYPE html>
<html>
<head>
    <title>GPS Dashboard</title>
    <meta charset="UTF-8">

    <!-- Leaflet Map -->
    <!-- Local copy, so the page works with the range air-gapped (see README step 7) -->
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css"/>
    <script src="vendor/leaflet/leaflet.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #0d1117;
            color: #e6edf3;
            padding: 20px;
        }

        h1 { color: #58a6ff; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 15px;
        }

        .card {
            background: #161b22;
            padding: 15px;
            border-radius: 12px;
        }

        .good { color: #3fb950; }
        .warn { color: #d29922; }
        .bad  { color: #f85149; }

        #map {
            height: 420px;
            margin-top: 15px;
            border-radius: 12px;
        }

        #alert {
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* ---- Satellite list ---- */
        .sys-summary { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .sys-chip {
            font-size: 12px; padding: 3px 8px; border-radius: 10px;
            background: #0d1117; border: 1px solid var(--sys);
        }
        .sys-chip b { color: var(--sys); }
        .sat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .sat-table th { text-align: left; color: #8b949e; font-weight: normal; padding: 2px 4px; border-bottom: 1px solid #30363d; }
        .sat-table td { padding: 3px 4px; border-bottom: 1px solid #21262d; white-space: nowrap; }
        .sat-table td.num, .sat-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
        .sat-name { border-left: 3px solid var(--sys); padding-left: 6px; }
        .snr-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--sys); vertical-align: middle; }
        .sat-table td.bar { width: 64px; padding-left: 6px; }
        /* The tracking card is wider than the others, on screens big enough for it. */
        @media (min-width: 760px) { .card.wide { grid-column: span 2; } }
        .untracked td { color: #6e7681; }
        /* Fixed height (about 15 rows) so the page below never moves as satellites come and go. */
        .sat-scroll { height: 340px; overflow-y: auto; }
        .sat-table th { position: sticky; top: 0; background: #161b22; z-index: 1; }
        .sat-footer { height: 30px; }
        #satToggle {
            margin-top: 8px; background: none; border: 1px solid #30363d; color: #8b949e;
            border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px;
        }
        #satToggle:hover { color: #e6edf3; border-color: #8b949e; }
        #satToggle:disabled { opacity: 0.4; cursor: default; }
    </style>
</head>
<body>

<h1>📡 GPS Dashboard</h1>

<div id="alert"></div>

<div class="grid">
    <div class="card">
        <h3>📍 Location</h3>
        <div id="location">Loading...</div>
    </div>

    <div class="card">
        <h3>🛰️ Satellites</h3>
        <div id="satellites">Loading...</div>
    </div>

    <div class="card wide">
        <h3>📡 Satellite Tracking</h3>
        <div id="satList">Loading...</div>
    </div>

    <div class="card">
        <h3>🕒 NTP Server</h3>
        <div id="ntp">Loading...</div>
    </div>

    <div class="card">
        <h3>📊 Status</h3>
        <div id="status">Loading...</div>
    </div> 

    <div class="card">
        <h3>⏱️ Time</h3>
        <div id="time">Loading...</div>
    </div>
</div>

<div id="map"></div>

<script>
// ---- Settings ----
// Map tiles. Point this at the range's own tile server for air-gapped use.
const TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
const TILE_ATTRIBUTION = '© OpenStreetMap contributors';

// One colour per satellite system, used in the list (and later the map and sky plot).
const SYSTEM_COLOURS = {
    GPS: '#58a6ff', GLONASS: '#f85149', Galileo: '#a371f7', BeiDou: '#d29922',
    QZSS: '#39c5cf', SBAS: '#8b949e', NavIC: '#db61a2', Other: '#8b949e'
};
const SYSTEM_ORDER = ['GPS', 'GLONASS', 'Galileo', 'BeiDou', 'QZSS', 'SBAS', 'NavIC', 'Other'];

// The map is optional. Without Leaflet (or without internet for the
// map tiles) the rest of the page still works.
let map = null, marker = null, trail = null;
if (window.L) {
    map = L.map('map').setView([0, 0], 2);
    // A drawn dot instead of Leaflet's default pin, which needs extra image files.
    marker = L.circleMarker([0, 0], {
        radius: 8, color: '#ffffff', weight: 2, fillColor: '#3fb950', fillOpacity: 1
    }).addTo(map);
    trail = L.polyline([], {weight: 3}).addTo(map);

    L.tileLayer(TILE_URL, { attribution: TILE_ATTRIBUTION }).addTo(map);
} else {
    document.getElementById("map").style.display = "none";
}

function show(v, digits) {
    if (v === null || v === undefined) return "--";
    return (digits !== undefined) ? Number(v).toFixed(digits) : v;
}

let path = [];
let centredOnce = false;   // centre the map on the first fix only, so the user can zoom and pan freely
let showUntracked = false; // satellites the receiver knows about but cannot hear (SNR 0)
let lastUpdateTime = Date.now();

function getMovement(speed) {
    return speed > 0.5 ? "MOVING 🚗" : "STATIONARY 🧍";
}

function getSignalQuality(data) {
    if (data.fix_quality == "0") return {text: "NO FIX ❌", class: "bad"};
    if (data.satellites_used < 4) return {text: "WEAK ⚠️", class: "warn"};
    if (data.hdop > 2) return {text: "LOW ACCURACY ⚠️", class: "warn"};
    return {text: "GOOD ✅", class: "good"};
}

function checkStale() {
    let diff = (Date.now() - lastUpdateTime) / 1000;

    if (diff > 5) {
        document.getElementById("alert").innerHTML =
            `<span class="bad">⚠️ GPS DATA STALE (${diff.toFixed(1)}s)</span>`;
    }
}

async function updateGPS() {
    try {
        const res = await fetch('temp/gps.json?cache=' + Date.now());
        const data = await res.json();

        lastUpdateTime = Date.now();

        let movement = getMovement(data.speed_knots);
        let signal = getSignalQuality(data);

        document.getElementById("location").innerHTML = `
            Lat: ${show(data.lat, 6)}<br>
            Lon: ${show(data.lon, 6)}<br>
            Alt: ${show(data.altitude_m)} m<br>
            Speed: ${show(data.speed_knots)} kn<br>
            State: <b>${movement}</b>
        `;

        document.getElementById("satellites").innerHTML = `
            Used: ${show(data.satellites_used)}<br>
            Tracked: ${show(data.satellites_tracked)}<br>
            In View: ${show(data.satellites_in_view)}<br>
            HDOP: ${show(data.hdop)}
        `;

        document.getElementById("status").innerHTML = `
            Fix: ${show(data.fix_mode)} (${data.status})<br>
            Signal: <span class="${signal.class}">${signal.text}</span>
        `;

        document.getElementById("time").innerHTML = `
            GPS: ${show(data.gps_time_utc)}<br>
            Pi: ${data.timestamp_utc}
        `;

        if (data.ntp_stratum === undefined) {
            document.getElementById("ntp").innerHTML =
                "<span class='bad'>chrony not answering</span>";
        } else {
            let onGps = data.ntp_source === "GPS";
            document.getElementById("ntp").innerHTML = `
                Source: <span class="${onGps ? 'good' : 'warn'}">${data.ntp_source || "none"}</span><br>
                Stratum: ${data.ntp_stratum}<br>
                Offset: ${(data.ntp_offset_s * 1000).toFixed(3)} ms<br>
                Leap: ${data.ntp_leap}
            `;
        }

        document.getElementById("alert").innerHTML = "";

        if (map && data.lat && data.lon) {
            marker.setLatLng([data.lat, data.lon]);
            if (!centredOnce) {
                map.setView([data.lat, data.lon], 16);
                centredOnce = true;
            }

            path.push([data.lat, data.lon]);
            if (path.length > 200) path.shift();

            trail.setLatLngs(path);
        }

    } catch (e) {
        document.getElementById("alert").innerHTML =
            `<span class="bad">⚠️ ERROR FETCHING GPS DATA</span>`;
    }
}

function sysStyle(name) {
    return `--sys:${SYSTEM_COLOURS[name] || SYSTEM_COLOURS.Other}`;
}

function satRow(sat) {
    const snr = sat.snr || 0;
    const bar = snr > 0 ? `<span class="snr-bar" style="width:${Math.min(snr, 50) * 1.2}px"></span>` : "";
    return `<tr class="${sat.tracked ? '' : 'untracked'}" style="${sysStyle(sat.gnss)}">
        <td><span class="sat-name">${sat.gnss} ${show(sat.svid)}</span></td>
        <td class="num">${snr}</td>
        <td class="bar">${bar}</td>
        <td class="num">${sat.elevation === null ? '--' : sat.elevation + '°'}</td>
        <td class="num">${sat.azimuth === null ? '--' : sat.azimuth + '°'}</td>
        <td>${sat.used ? "<span class='good'>USED</span>" : ""}</td>
    </tr>`;
}

async function updateSatellites() {
    try {
        const res = await fetch('temp/satellites.json?cache=' + Date.now());
        const data = await res.json();
        const sats = data.satellites || [];

        if (sats.length === 0) {
            document.getElementById("satList").innerHTML =
                "<span class='warn'>No satellites in view yet</span>";
            return;
        }

        // One chip per system: used / tracked / in view.
        const systems = data.systems || {};
        const chips = SYSTEM_ORDER.filter(n => systems[n]).map(n => {
            const c = systems[n];
            return `<span class="sys-chip" style="${sysStyle(n)}" title="used / tracked / in view">
                <b>${n}</b> ${c.used} / ${c.tracked} / ${c.in_view}</span>`;
        }).join("");

        const tracked = sats.filter(s => s.tracked);
        const untracked = sats.filter(s => !s.tracked);
        const rows = tracked.concat(showUntracked ? untracked : []).map(satRow).join("");

        const toggle = `<button id="satToggle" ${untracked.length === 0 ? "disabled" : ""}
                onclick="showUntracked = !showUntracked; updateSatellites();">
                ${showUntracked ? "Hide" : "Show"} ${untracked.length} not tracked (SNR 0)</button>`;

        // Keep the reader's scroll position across refreshes.
        const old = document.querySelector("#satList .sat-scroll");
        const scrollTop = old ? old.scrollTop : 0;

        document.getElementById("satList").innerHTML = `
            <div class="sys-summary">${chips}</div>
            <div class="sat-scroll">
                <table class="sat-table">
                    <tr><th>Satellite</th><th class="num" title="Signal-to-noise ratio, dB-Hz. Above about 30 is strong.">SNR</th><th></th><th class="num">Elev</th><th class="num">Az</th><th></th></tr>
                    ${rows || "<tr><td colspan='6' class='warn'>None tracked yet</td></tr>"}
                </table>
            </div>
            <div class="sat-footer">${toggle}</div>`;

        document.querySelector("#satList .sat-scroll").scrollTop = scrollTop;

    } catch (e) {
        document.getElementById("satList").innerHTML =
            "<span class='bad'>No satellite tracking data</span>";
    }
}

setInterval(updateGPS, 1000);
setInterval(updateSatellites, 2000);
setInterval(checkStale, 2000);

updateGPS();
updateSatellites();
</script>

</body>
</html>
