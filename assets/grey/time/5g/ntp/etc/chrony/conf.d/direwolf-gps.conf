# /etc/chrony/conf.d/direwolf-gps.conf  -  Dire Wolf range time server

# GPS time from gpsd (shared memory segment 0). NMEA over USB, no PPS.
# "offset" is set by: sudo ./install.sh --offset N --go  (README, "Tune the offset").
refclock SHM 0 refid GPS poll 4 precision 1e-1 offset 0.0 delay 0.2

# Who may ask this server for time: every private range network.
allow 10.0.0.0/8
allow 172.16.0.0/12
allow 192.168.0.0/16

# Keep serving time from the Pi's own clock if GPS drops out.
local stratum 8

# Fix a badly wrong clock at boot (the Pi has no battery clock).
makestep 1.0 3
