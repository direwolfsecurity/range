# dns.conf - settings for the range reverse DNS server (install.sh reads this file).
#
# License: GPL-3.0, Dire Wolf Security.

# This server's name under arpa. The root delegates "arpa" to this name (README step 3).
# The real internet's in-addr.arpa servers are called a.in-addr-servers.arpa to f.in-addr-servers.arpa.
NS_NAME="a.in-addr-servers.arpa"

# The registry file. The builder reads it, together with registry.py next to it.
# Default: the copy you get with the two-folder clone in the README.
# A path that starts with / is used as it is; any other path is relative to this folder.
REGISTRY_FILE="../../../network/registry/registry.csv"

# Exercise teams: the range control server (assets/white/control) writes this file and runs
# dns-apply. Same columns as registry.csv. Missing or empty = no exercise, registry.csv only.
OVERLAY_FILE="/etc/direwolf-range/overlay.csv"

# ISP domains: this server also runs their forward zones, so every generic reverse name
# (192-168-103-5.austin.bluestem.lab) points back at its address. Space separated.
# Each one must be a domain in the registry, and the registrar must hand it to this server
# (install.sh --registrar prints the commands). Leave a domain out if someone else runs it.
ISP_DOMAINS="bluestem.lab meridian.lab granite.lab nightjar.lab tunnelfox.lab"

# Who to write to about these zones (the SOA contact). The @ is written as a dot.
HOSTMASTER="hostmaster.nic.lab"

# Log every query to /var/log/named/query.log (useful for scoring and forensics). yes or no.
QUERY_LOG="yes"

# The range resolver (the range's "8.8.8.8"). --check also asks through it, the way every machine
# on the range does. Empty = skip that part of the check.
RESOLVER_IP="172.16.11.10"
