# names.conf - fixed reverse names (PTR) for single addresses.
#
# One address per line:  <IPv4 address>  <name>
# Everything not listed here gets its name from the registry:
#   - a single-address row (172.16.11.60/32) gets that row's domain (maps.lab)
#   - every other address gets a generic name, like a real ISP: 192-168-103-5.austin.bluestem.lab
# This server's own address is added by itself (a.in-addr-servers.arpa), unless you list it here.
#
# A good PTR points at a name that points back at the same address ("forward-confirmed").
# So when you add a server here, register its name on the registrar too.
# After a change: sudo bash install.sh --go
#
# License: GPL-3.0, Dire Wolf Security.

# ---- GREY: the fake internet's own servers ----
172.16.11.11    a.root-servers.net
172.16.11.12    b.root-servers.net
172.16.11.30    check.lab
172.16.11.43    whois.lab
172.16.11.50    geoip.lab
172.16.11.83    mqtt.lab
