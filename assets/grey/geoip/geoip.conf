# geoip.conf - settings for the range GeoIP server (install.sh reads this file).
#
# License: GPL-3.0, Dire Wolf Security.

# The DNS name of this server. Register it on the root primary (README step 3).
SERVER_NAME="geoip.lab"

# The registry file. The builder reads it, together with registry.py next to it.
# Default: the copy you get with the two-folder clone in the README.
# A path that starts with / is used as it is; any other path is relative to this folder.
REGISTRY_FILE="../../../network/registry/registry.csv"

# Exercise teams: the range control server (assets/white/control) writes this file and runs
# geoip-apply. Same columns as registry.csv. Missing or empty = no exercise, registry.csv only.
OVERLAY_FILE="/etc/direwolf-range/overlay.csv"

# The name of the fake internet registry. Shown in the database description and on the web page.
# (Open decision: Tim picks the real name. Change it here and in registry.csv's GREY row.)
REGISTRY_NAME="Grey Internet Registry"

# Port for the plain-HTTP site: the "what is my location" page and the database downloads.
HTTP_PORT="80"

# HTTPS with a certificate from the range CA (../ca/). "yes" or "no".
# Needed only for the stock geoipupdate tool, which always uses HTTPS.
# Needs the CA built and geoip.lab registered first (README steps 3 and 6).
HTTPS="no"
CA_URL="http://ca.lab"
ACME_URL="https://ca.lab/acme/acme/directory"
# The root fingerprint the CA's --check shows. Empty = trust whatever ca.lab sends (not wise).
CA_FINGERPRINT=""

# Extra names for the HTTPS certificate, space separated. Add "updates.maxmind.com" here AND to
# connectivity-check/names.conf if you want geoipupdate to work with its default settings.
EXTRA_CERT_NAMES=""

# mod_maxminddb, the Apache module that range web servers build (client/range-geoip-client.sh).
# install.sh downloads it once, while this server has internet, and serves it at /download/,
# so web servers on the air-gapped range can build it too.
MOD_MAXMINDDB_VERSION="1.3.0"
MOD_MAXMINDDB_SHA256="877d3a36fa4bbcf807468c00b8cfedd7e16fa4039c5d465b5490bbdb243ad5cd"
MOD_MAXMINDDB_URL="https://github.com/maxmind/mod_maxminddb/releases/download/1.3.0/mod_maxminddb-1.3.0.tar.gz"
