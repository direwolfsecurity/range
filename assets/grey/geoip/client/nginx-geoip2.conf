# Range GeoIP for nginx (ngx_http_geoip2_module). From http://@SERVER_NAME@/download/
# range-geoip-client.sh --nginx puts this in /etc/nginx/conf.d/range-geoip2.conf.
# Use the variables in any server block, log format or "map".
#
# License: GPL-3.0, Dire Wolf Security.

geoip2 /var/lib/GeoIP/GeoLite2-City.mmdb {
    auto_reload 60m;
    $geoip2_country_code country iso_code;
    $geoip2_country_name country names en;
    $geoip2_region_name  subdivisions 0 names en;
    $geoip2_city         city names en;
    $geoip2_latitude     location latitude;
    $geoip2_longitude    location longitude;
    $geoip2_time_zone    location time_zone;
}
geoip2 /var/lib/GeoIP/GeoLite2-ASN.mmdb {
    auto_reload 60m;
    $geoip2_asn    autonomous_system_number;
    $geoip2_as_org autonomous_system_organization;
}

# Pass them to PHP (add inside your "location ~ \.php$" block):
#     fastcgi_param MM_COUNTRY_CODE $geoip2_country_code;
#     fastcgi_param MM_CITY         $geoip2_city;
#     fastcgi_param MM_LATITUDE     $geoip2_latitude;
#     fastcgi_param MM_LONGITUDE    $geoip2_longitude;
#
# Geofencing example: "yes" for visitors from the US and Canada.
#     map $geoip2_country_code $allowed_country { default no; US yes; CA yes; }
# then in a location:  if ($allowed_country = no) { return 403; }
