# Range GeoIP for Apache (mod_maxminddb). From http://@SERVER_NAME@/download/
# range-geoip-client.sh --apache puts this in /etc/apache2/mods-available/maxminddb.conf.
#
# Every request gets environment variables with the visitor's location.
# PHP sees them in $_SERVER (for example $_SERVER['MM_CITY']), CGI scripts as normal
# environment variables, and the access log can print them with %{MM_CITY}e.
#
# License: GPL-3.0, Dire Wolf Security.

<IfModule mod_maxminddb.c>
    MaxMindDBEnable On
    MaxMindDBFile CITY_DB /var/lib/GeoIP/GeoLite2-City.mmdb
    MaxMindDBFile ASN_DB  /var/lib/GeoIP/GeoLite2-ASN.mmdb

    MaxMindDBEnv MM_COUNTRY_CODE  CITY_DB/country/iso_code
    MaxMindDBEnv MM_COUNTRY_NAME  CITY_DB/country/names/en
    MaxMindDBEnv MM_CONTINENT     CITY_DB/continent/code
    MaxMindDBEnv MM_REGION_CODE   CITY_DB/subdivisions/0/iso_code
    MaxMindDBEnv MM_REGION_NAME   CITY_DB/subdivisions/0/names/en
    MaxMindDBEnv MM_CITY          CITY_DB/city/names/en
    MaxMindDBEnv MM_POSTAL        CITY_DB/postal/code
    MaxMindDBEnv MM_LATITUDE      CITY_DB/location/latitude
    MaxMindDBEnv MM_LONGITUDE     CITY_DB/location/longitude
    MaxMindDBEnv MM_ACCURACY_KM   CITY_DB/location/accuracy_radius
    MaxMindDBEnv MM_TIME_ZONE     CITY_DB/location/time_zone
    MaxMindDBEnv MM_ASN           ASN_DB/autonomous_system_number
    MaxMindDBEnv MM_AS_ORG        ASN_DB/autonomous_system_organization
    MaxMindDBNetworkEnv CITY_DB   MM_NETWORK
</IfModule>

# Geofencing example: keep one folder for visitors from the US and Canada only.
# Uncomment, change the folder and the country codes, then: sudo systemctl reload apache2
#
# <Directory /var/www/html/north-america-only>
#     SetEnvIf MM_COUNTRY_CODE ^(US|CA)$ AllowedCountry
#     Require env AllowedCountry
# </Directory>
