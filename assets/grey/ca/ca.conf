# ca.conf - settings for the range certificate authority (install.sh reads this file).
#
# License: GPL-3.0, Dire Wolf Security.

# The name students see when they look at a certificate.
# step-ca adds the rest: the root is "<CA_NAME> Root CA", the intermediate "<CA_NAME> Intermediate CA".
CA_NAME="Dire Wolf Range"

# The DNS name of this server. ACME clients use https://<SERVER_NAME>/acme/acme/directory.
# It goes in the CA's own HTTPS certificate, along with this server's address.
SERVER_NAME="ca.lab"

# Port for the CA itself (ACME and the step-ca API), always HTTPS.
CA_PORT="443"

# Port for the plain-HTTP download page (root certificate and client install scripts).
# Plain HTTP on purpose: a client can't check HTTPS until it trusts our root.
DOWNLOAD_PORT="80"

# The DNS server the CA asks when it checks an ACME request (the range resolver).
# It must resolve range names like mqtt.lab and the names your students register.
RESOLVER="172.16.11.10"

# How long certificates last, in days. 90 days is what Let's Encrypt gives.
# Clients may ask for a shorter time, never a longer one than MAX_CERT_DAYS.
DEFAULT_CERT_DAYS="90"
MAX_CERT_DAYS="365"

# Where to get the step-ca and step-cli packages.
#   "smallstep" = Smallstep's apt repository (needs internet while installing)
#   a folder    = .deb files you downloaded beforehand (for a closed range), for example "/root/step-debs"
STEP_PACKAGES="smallstep"
