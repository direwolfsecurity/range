; range.example.ini -- settings for gencfg.py.
; Copy to range.ini and edit. Lines starting with ; are comments.
; Nothing in here is secret: passwords are filled later by Set-Secrets.ps1.

[pods]
; The class roster. Copy student-list.example.csv to this name. It is git-ignored.
student_list = student-list.csv
; Pod N's outside network is 192.168.(base + N).0/24. Default: pod 1 = 192.168.101.0/24.
outside_third_octet_base = 100
; Pod N's outside VLAN on hardware edge routers is (base + N). Local to each edge.
outside_vlan_base = 100
; Inside and DMZ are the SAME in every pod, so every lab guide's addresses work for every student.
inside_net = 10.10.10.0/24
dmz_net = 10.9.9.0/24

[proxmox]
; Nodes to spread pods across, in order. A pod row with a host column overrides this.
nodes = pve1
; shared  = one SDN zone on one bridge, unique VLAN tags per pod. Use this for an all-virtual range.
; per-pod = one zone per pod on its own bridge and NIC (for a hardware firewall per pod).
zone_mode = shared
; shared mode only: the VLAN-aware bridge the zone sits on, and the tag bases per pod network.
; Pod N gets tags (outside_tag_base + N), (inside_tag_base + N), (dmz_tag_base + N).
zone = dwrange
bridge = vmbr1
outside_tag_base = 1000
inside_tag_base = 2000
dmz_tag_base = 3000
; per-pod mode only: NICs for pod bridges on each node, in order. Overridable per row (nic column).
pod_nics = enp1s0, enp2s0
; Pod N's VMs get IDs (vmid_base + N*10) to (vmid_base + N*10 + 9). Pod 3 = 1030-1039.
vmid_base = 1000
student_role = DWStudent
storages = local, local-lvm

[templates]
; Optional. VM IDs of templates to clone into every pod. Leave blank to skip.
; firewall: OPNsense template. Gets net0 = outside (WAN), net1 = inside (LAN), net2 = DMZ (OPT1).
firewall =
; kali: attacker VM on the pod's outside network.
kali =
; yes = full clones (slower, independent). no = linked clones (fast, need the template).
full_clone = no

[profiles]
; firewall: opnsense (VMs from [templates]), asa (one Firepower/ASA per pod), or none
firewall = opnsense
; yes = also build configs for a Cisco core switch and edge routers (hardware labs)
cisco_core_edge = no

; ---------------------------------------------------------------------------
; Everything below is only read when the profiles above ask for it.
; ---------------------------------------------------------------------------

[asa]
; Network the firewalls' Management1/1 ports live on. SSH/ASDM is allowed from here.
mgmt_net = 192.0.2.0/24
dns = 172.16.11.10
syslog = 172.16.12.30

[cisco]
core_model = Catalyst 3750, IOS 12.2(55)SE
edge_model = Cisco 2811 + NM-16ESW
; Edge routers needed = pods / ports_per_edge, rounded up. One core port per edge, in order.
ports_per_edge = 15
edge_core_ports = Fa1/0/47, Fa1/0/48
transit_vlan_base = 300
transit_net_pattern = 172.30.{k}.0/24
; The single cable to the outside world. CLOSED mode shuts it.
uplink_port = Fa1/0/30
uplink_vlan = 330
uplink_net = 192.168.33.0/24
uplink_gateway = 192.168.33.1
redteam_vpn_net = 10.250.250.0/24
; Trunk carrying the shared VLANs to the grey/white Proxmox host. Blank = none.
trunk_port = Gi1/0/1
; DHCP on the core for one VLAN (here, the city). Blank = none.
dhcp_vlan = 340
dhcp_hosts = 100-150
dns = 172.16.11.10
syslog = 172.16.12.30

[vlans]
; Shared networks routed by the core:  NAME = vlan, subnet   (gateway is .254)
GREY = 110, 172.16.11.0/24
WHITECELL = 120, 172.16.12.0/24
REDCELL = 130, 172.16.13.0/24
CITY = 340, 192.168.34.0/24
TARGETS-A = 410, 192.168.200.0/24
TARGETS-B = 420, 192.168.210.0/24

[core_access]
; Access ports on the core:  ports = vlan, description
Fa1/0/1 - 8 = 110, GREY physical assets
Fa1/0/9 - 12 = 120, WHITECELL
Fa1/0/13 - 20 = 130, REDCELL
Fa1/0/21 - 28 = 410, TARGETS-A physical
Fa1/0/36 - 40 = 340, CITY wired and access point
